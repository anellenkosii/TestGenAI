<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TestGen AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
</head>
<body>
    <main class="shell">
        <section class="workspace">
            <div class="pane input-pane">
                <header class="topbar">
                    <div>
                        <h1>TestGen AI</h1>
                        <p>Generate, inspect, and run unit tests.</p>
                    </div>
                    <div class="controls">
                        <select id="language">
                            <option value="python" selected>Python</option>
                            <option value="java">Java</option>
                            <option value="javascript">JavaScript</option>
                        </select>
                        <select id="mode">
                            <option value="standard" selected>Standard</option>
                            <option value="tdd">TDD</option>
                        </select>
                    </div>
                </header>

                <div class="tab-buttons">
                    <button class="tab-btn active" data-tab="code">Code</button>
                    <button class="tab-btn" data-tab="analyze">Analyze</button>
                </div>

                <div id="tab-code" class="tab-content active">
                    <label for="code">Code</label>
                    <textarea id="code" spellcheck="false" placeholder="Paste code here"></textarea>
                    <div class="file-row">
                        <input id="file" type="file" accept=".py,.java,.js">
                        <span id="fileName">No file selected</span>
                    </div>
                    <label for="requirements">Requirements</label>
                    <textarea id="requirements" class="short" spellcheck="false" placeholder="What should this code do?"></textarea>
                </div>

                <div id="tab-analyze" class="tab-content">
                    <label for="description">Project Description</label>
                    <textarea id="description" class="short" spellcheck="false" placeholder="Describe the expected behavior"></textarea>
                    <button id="analyzeBtn" class="secondary">Analyze Code</button>
                    <div id="analysisResult"></div>
                </div>

                <div class="button-group">
                    <button id="generate" class="primary">Generate Tests</button>
                    <button id="explainBtn" class="secondary">Explain Tests</button>
                </div>
            </div>

            <div class="pane result-pane">
                <div class="result-head">
                    <div>
                        <h2>Results</h2>
                        <p id="status">Ready</p>
                    </div>
                    <div class="actions">
                        <button id="copy" disabled>Copy</button>
                        <button id="download" disabled>Download</button>
                        <button id="run" disabled>Run Tests</button>
                    </div>
                </div>

                <div id="alert" class="alert" hidden></div>

                <h3>Generated Tests</h3>
                <pre class="code-box"><code id="tests" class="language-python"></code></pre>

                <div id="explanation-section" hidden>
                    <h3>Test Explanation</h3>
                    <div id="explanation-content" class="explanation-box"></div>
                </div>

                <h3>Test Output</h3>
                <pre id="output" class="output">No tests run yet.</pre>

                <div id="analysis-output" class="analysis-box" hidden></div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script>
        const state = { testFile: "", codeFile: "", language: "python", tests: "", explanation: "" };
        const el = (id) => document.getElementById(id);
        const prismLanguage = { python: "python", java: "java", javascript: "javascript" };

        document.querySelectorAll(".tab-btn").forEach((button) => {
            button.addEventListener("click", () => {
                document.querySelectorAll(".tab-btn").forEach((item) => item.classList.remove("active"));
                document.querySelectorAll(".tab-content").forEach((item) => item.classList.remove("active"));
                button.classList.add("active");
                el("tab-" + button.dataset.tab).classList.add("active");
            });
        });

        el("file").addEventListener("change", () => {
            const file = el("file").files[0];
            el("fileName").textContent = file ? file.name : "No file selected";
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => { el("code").value = reader.result; };
            reader.readAsText(file);
        });

        el("generate").addEventListener("click", async () => {
            if (!el("code").value.trim() && !el("file").files[0]) {
                showAlert("Please paste code or upload a file first.");
                return;
            }

            setBusy(true, "Generating tests...");
            clearAlert();
            el("output").textContent = "No tests run yet.";
            el("explanation-section").hidden = true;

            const form = new FormData();
            form.append("language", el("language").value);
            form.append("code", el("code").value);
            form.append("requirements", el("requirements").value);
            form.append("mode", el("mode").value);
            if (el("file").files[0]) form.append("code_file", el("file").files[0]);

            try {
                const data = await postForm("/generate_tests", form);
                state.testFile = data.test_file;
                state.codeFile = data.code_file;
                state.language = data.language;
                state.tests = data.tests;
                state.explanation = data.explanation || "";
                renderTests(data.tests, data.language);
                setActions(true);
                setStatus("Generated " + data.test_file);
            } catch (error) {
                showAlert(error.message);
                setActions(false);
                setStatus("Generation failed", true);
            } finally {
                setBusy(false);
            }
        });

        el("explainBtn").addEventListener("click", () => {
            if (!state.explanation) {
                showAlert("Generate tests first.");
                return;
            }
            el("explanation-content").textContent = state.explanation;
            el("explanation-section").hidden = false;
        });

        el("analyzeBtn").addEventListener("click", async () => {
            if (!el("code").value.trim()) {
                showAlert("Please paste code in the Code tab first.");
                return;
            }

            setBusy(true, "Analyzing...");
            clearAlert();
            try {
                const data = await postJson("/analyze_code", {
                    code: el("code").value,
                    language: el("language").value,
                    description: el("description").value,
                });
                renderAnalysis(data.analysis);
                setStatus("Analysis complete");
            } catch (error) {
                showAlert(error.message);
                setStatus("Analysis failed", true);
            } finally {
                setBusy(false);
            }
        });

        el("copy").addEventListener("click", async () => {
            await navigator.clipboard.writeText(state.tests);
            setStatus("Copied");
        });

        el("download").addEventListener("click", () => {
            if (state.testFile) window.location.href = "/download_test/" + encodeURIComponent(state.testFile);
        });

        el("run").addEventListener("click", async () => {
            setBusy(true, "Running tests...");
            clearAlert();
            try {
                const data = await postJson("/run_tests", {
                    language: state.language,
                    test_file: state.testFile,
                    code_file: state.codeFile,
                });
                el("output").textContent = data.output || data.error || "No output.";
                setStatus(data.success ? "Tests passed" : "Tests failed", !data.success);
                if (!data.success && data.error) showAlert(data.error);
            } catch (error) {
                showAlert(error.message);
                setStatus("Run failed", true);
            } finally {
                setBusy(false);
            }
        });

        function renderTests(code, language) {
            const codeEl = el("tests");
            codeEl.className = "language-" + prismLanguage[language];
            codeEl.textContent = code;
            Prism.highlightElement(codeEl);
        }

        function renderAnalysis(analysis) {
            const box = el("analysis-output");
            box.hidden = false;
            box.innerHTML = `
                <h3>Code Analysis</h3>
                <p><strong>Quality score:</strong> ${analysis.quality_score}/100</p>
                <p><strong>Strengths:</strong> ${listText(analysis.strengths)}</p>
                <p><strong>Weaknesses:</strong> ${listText(analysis.weaknesses)}</p>
                <p><strong>Suggestions:</strong> ${listText(analysis.suggestions)}</p>
                <p><strong>Readings:</strong> ${listText(analysis.readings)}</p>
            `;
        }

        function listText(items) {
            return items && items.length ? items.join(", ") : "None";
        }

        async function postForm(url, body) {
            return parseResponse(await fetch(url, { method: "POST", body }));
        }

        async function postJson(url, body) {
            return parseResponse(await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            }));
        }

        async function parseResponse(response) {
            let data;
            try {
                data = await response.json();
            } catch {
                throw new Error("Server returned an invalid response.");
            }
            if (!response.ok || data.success === false) throw new Error(data.error || "Request failed.");
            return data;
        }

        function setBusy(isBusy, text = "Ready") {
            el("generate").disabled = isBusy;
            el("analyzeBtn").disabled = isBusy;
            el("run").disabled = isBusy || !state.testFile;
            if (isBusy) setStatus(text);
        }

        function setActions(enabled) {
            el("copy").disabled = !enabled;
            el("download").disabled = !enabled;
            el("run").disabled = !enabled;
        }

        function setStatus(message, isError = false) {
            el("status").textContent = message;
            el("status").classList.toggle("error-text", isError);
        }

        function showAlert(message) {
            el("alert").textContent = message;
            el("alert").hidden = false;
        }

        function clearAlert() {
            el("alert").hidden = true;
            el("alert").textContent = "";
        }
    </script>
</body>
</html>
